apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard
  labels:
    app: leaderboard
spec:
  replicas: {{ .Values.leaderboard.replicas }}
  selector:
    matchLabels:
      app: leaderboard
  template:
    metadata:
      labels:
        app: leaderboard
    spec:
      containers:
        - name: leaderboard
          image: "{{ .Values.image.registry }}/leaderboard:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources: {{ toYaml .Values.leaderboard.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: leaderboard
spec:
  type: {{ .Values.leaderboard.service.type }}
  selector:
    app: leaderboard
  ports:
    - port: {{ .Values.leaderboard.service.port }}
      targetPort: 3000
