name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - "botfleet/**"
      - "telemetry/**"
      - "leaderboard/**"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches: [main]
    paths:
      - "sandbox/**"
      - "botfleet/**"
      - "telemetry/**"
      - "leaderboard/**"

env:
  REGISTRY: ghcr.io
  ORG: quant-titans

jobs:
  build-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless OIDC signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: sandbox
            context: ./sandbox
          - service: botfleet
            context: ./botfleet
          - service: telemetry
            context: ./telemetry
          - service: leaderboard
            context: ./leaderboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr,prefix=pr-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

  # Summary job — required check for branch protection
  images-ready:
    name: All images built
    runs-on: ubuntu-latest
    needs: build-push
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.build-push.result }}" != "success" ]]; then
            echo "One or more image builds failed"
            exit 1
          fi
          echo "All 4 images built successfully"
