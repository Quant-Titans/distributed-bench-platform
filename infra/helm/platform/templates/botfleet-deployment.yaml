apiVersion: apps/v1
kind: Deployment
metadata:
  name: botfleet
  namespace: {{ .Release.Namespace }}
  labels:
    app: botfleet
spec:
  replicas: {{ .Values.botfleet.replicas }}
  selector:
    matchLabels:
      app: botfleet
  template:
    metadata:
      labels:
        app: botfleet
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: botfleet
          image: "{{ .Values.image.registry }}/botfleet:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9090
              name: grpc
          env:
            {{- range $k, $v := .Values.botfleet.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":9090"
          resources: {{ toYaml .Values.botfleet.resources | nindent 12 }}
          livenessProbe:
            grpc: { port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            grpc: { port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: botfleet
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: botfleet
  ports:
    - port: 9090
      targetPort: 9090
      name: grpc
---
{{- if .Values.botfleet.hpa }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: botfleet
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: botfleet
  minReplicas: {{ .Values.botfleet.hpa.minReplicas }}
  maxReplicas: {{ .Values.botfleet.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.botfleet.hpa.targetCPUUtilizationPercentage }}
{{- end }}
