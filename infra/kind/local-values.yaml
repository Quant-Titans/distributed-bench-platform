# Local kind overrides — scaled-down resources, NodePort services, eBPF disabled
image:
  registry: quant-titans   # local — loaded via kind load docker-image
  pullPolicy: Never        # never try remote registry in kind
  pullSecrets: []

timescaledb:
  image: timescale/timescaledb:latest-pg16   # latest-pg16 is multi-arch (amd64 + arm64)
  storage: 1Gi
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

redis:
  storage: 512Mi
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

sandbox:
  replicas: 1
  service:
    type: NodePort
    nodePort: 30080   # kind cluster.yaml forwards hostPort 8080 → containerPort 30080
  dockerSock:
    enabled: false   # kind nodes have no docker.sock — sandbox spawns via K8s API instead
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  env:
    KAFKA_BROKER:     "quant-titans-0.quant-titans:9093"
    EBPF_TOPIC:       "telemetry.kernel_latency"
    EVENTS_TOPIC:     "bench.events"
    SANDBOX_INSECURE: "true"   # disables eBPF + seccomp for local kind (no Linux kernel access)
    SANDBOX_NETWORK:  "host"
  nodeSelector: {}
  tolerations: []

botfleet:
  replicas: 1
  resources:
    requests: { cpu: "200m", memory: "128Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  env:
    KAFKA_BROKER: "quant-titans-0.quant-titans:9093"

telemetry:
  replicas: 1
  resources:
    requests: { cpu: "200m", memory: "128Mi" }
    limits:   { cpu: "1",    memory: "512Mi" }
  env:
    KAFKA_BROKER:    "quant-titans-0.quant-titans:9093"
    TIMESCALEDB_URL: "postgres://quant:titans@timescaledb:5432/metrics"
    REDIS_URL:       "redis:6379"

leaderboard:
  replicas: 1
  service:
    type: NodePort
    port: 80
    targetPort: 8082
    nodePort: 30082
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }
  env:
    KAFKA_BROKER:    "quant-titans-0.quant-titans:9093"
    SCORE_TOPIC:     "bench.scores"
    CONSUMER_GROUP:  "leaderboard-ws"
    STATIC_DIR:      "/app/dist"
    TIMESCALE_DSN:   "postgres://quant:titans@timescaledb:5432/metrics"

redpanda:
  tls:
    enabled: false   # no cert-manager in local kind
  listeners:
    http:
      external:
        default:
          enabled: false   # frees NodePort 30082 for the leaderboard service
    schemaRegistry:
      external:
        default:
          enabled: false   # frees NodePort 30081
  statefulset:
    replicas: 1
  storage:
    persistentVolume:
      size: 2Gi
  resources:
    requests: { cpu: "200m", memory: "1500Mi" }
    limits:   { cpu: "1",    memory: "1500Mi" }
    memory:
      redpanda:
        memory: 1000Mi     # heap given to Redpanda broker
        reserveMemory: 0Mi # no OS reserve — safe in k8s with limits set
  config:
    rpk:
      additional_start_flags:
        - "--smp=1"
        - "--overprovisioned"

grafana:
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "200m", memory: "128Mi" }
