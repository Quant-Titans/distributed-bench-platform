apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    app: sandbox
spec:
  replicas: {{ .Values.sandbox.replicas }}
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandbox.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandbox.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox
          image: "{{ .Values.image.registry }}/sandbox:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            {{- range $k, $v := .Values.sandbox.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: ":8080"
          resources: {{ toYaml .Values.sandbox.resources | nindent 12 }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN        # eBPF TC attachment
                - SYS_ADMIN        # BPF syscall + rlimit
                - NET_BIND_SERVICE
          volumeMounts:
            {{- if not (eq ((.Values.sandbox.dockerSock).enabled) false) }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            - name: seccomp-profile
              mountPath: /etc/sandbox
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- if not (eq ((.Values.sandbox.dockerSock).enabled) false) }}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
        - name: seccomp-profile
          configMap:
            name: sandbox-seccomp
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ (.Values.sandbox.service).type | default "ClusterIP" }}
  selector:
    app: sandbox
  ports:
    - port: 8080
      targetPort: 8080
      {{- if (.Values.sandbox.service).nodePort }}
      nodePort: {{ .Values.sandbox.service.nodePort }}
      {{- end }}
